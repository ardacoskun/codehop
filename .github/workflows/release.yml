name: Release

on:
  push:
    branches: [main]
  # Rebuild and upload assets for an existing tag (e.g. after a failed run).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.0
        required: true

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  goreleaser:
    needs: release-please
    if: >-
      always() && (needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v')))
    runs-on: ubuntu-latest
    # Protected environment: TAP_GITHUB_TOKEN is only available here.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew and Scoop are only published from the public repository:
          # their users download release assets without authentication.
          PUBLIC_RELEASE: ${{ github.event.repository.visibility == 'public' }}
          # Fine-grained token with contents:write on homebrew-tap and scoop-bucket only.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      - name: Attest build provenance
        # Attestations need a public repository (or GitHub Enterprise Cloud).
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
