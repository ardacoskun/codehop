name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `codehop doctor`
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: codehop version (`codehop --version`)
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options: [zsh, bash, fish, PowerShell 7, Windows PowerShell 5.1, Git Bash, other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Ubuntu 24.04, Windows 11...
    validations:
      required: true
